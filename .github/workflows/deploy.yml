name: Deploy to WordPress

on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: deploy-peptide-search-ai
  cancel-in-progress: true

jobs:
  test:
    name: Pre-deploy tests
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  validate:
    name: Validate deployment
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify PSA_VERSION constant
        run: |
          if grep -q "define( 'PSA_VERSION'" peptide-search-ai.php; then
            version=$(grep "define( 'PSA_VERSION'" peptide-search-ai.php | sed "s/.*'\([^']*\)'.*/\1/")
            echo "✓ PSA_VERSION: $version"
          else
            echo "❌ PSA_VERSION not found"; exit 1
          fi

  deploy:
    name: Deploy (shared pipeline)
    needs: validate
    uses: peptide-repo/peptide-e2e/.github/workflows/deploy-app.yml@main
    with:
      target_path: wp-content/plugins/peptide-search-ai
    secrets: inherit
