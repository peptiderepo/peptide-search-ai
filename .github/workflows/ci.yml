name: CI

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_call: {}

# Required: reusable phpcs job declares contents: write for phpcbf auto-commit,
# but GitHub enforces that the caller must also declare it at workflow level.
permissions:
  contents: write

jobs:
  ci:
    uses: peptiderepo/peptide-e2e/.github/workflows/ci.yml@main
    with:
      tests: stubs
      has_js: true
    secrets: inherit
